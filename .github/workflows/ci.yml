# Every push and pull request: validate the species data, lint, typecheck,
# test and build. Pushes to main then deploy to GitHub Pages.
#
# Deploying is off until the repo variable DEPLOY_PAGES is "true", so CI stays
# green while the repo is private (Pages on a private repo needs a paid plan).
# To turn it on: Settings → Pages → Source: "GitHub Actions", then
#   gh variable set DEPLOY_PAGES --body true
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run validate
      - run: npm run lint:check
      - run: npm run typecheck
      - run: npm test
      # A project site is served from /<repo>/, so assets need that prefix.
      # Using a custom domain? Set BASE_PATH to "/" instead.
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v4
        if: vars.DEPLOY_PAGES == 'true' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    needs: check
    if: vars.DEPLOY_PAGES == 'true' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
