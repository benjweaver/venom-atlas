name: Northern short-tailed shrew
scientificName: Blarina brevicauda
group: mammal
danger: 1
summary: >-
  One of very few venomous mammals. Its saliva paralyses prey such as insects and mice.
venom: >-
  Harmless to people beyond a painful bite with local burning and swelling.
habitat: >-
  Forests, fields and marshes with deep leaf litter or snow cover.
size: About 12 cm including tail
