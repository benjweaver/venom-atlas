name: Common krait
scientificName: Bungarus caeruleus
group: snake
danger: 5
summary: >-
  A nocturnal, shiny black-and-white banded snake of South Asia, notorious for biting people
  asleep on floors.
venom: >-
  Powerfully neurotoxic: bites may be painless, then paralysis and respiratory failure follow
  hours later.
habitat: >-
  Fields, scrub, villages and houses; active at night.
size: About 1 m
