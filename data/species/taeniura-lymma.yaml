name: Bluespotted ribbontail ray
scientificName: Taeniura lymma
group: fish
danger: 2
summary: >-
  A small, bright ray of Indo-Pacific reefs, often seen by snorkellers.
venom: >-
  Deep, very painful wounds from the tail barb, with swelling and a high risk of infection; hot
  water eases the pain.
habitat: >-
  Coral reefs and sand patches.
