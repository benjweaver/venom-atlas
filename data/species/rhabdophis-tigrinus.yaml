name: Yamakagashi
scientificName: Rhabdophis tigrinus
group: snake
danger: 4
summary: >-
  A rear-fanged keelback of Japan and East Asia. Long thought harmless, it has caused fatal
  bleeding.
venom: >-
  Haemotoxic: severe clotting failure developing hours after the bite.
habitat: >-
  Rice paddies, wetlands and streams.
