name: Lesser banded hornet
scientificName: Vespa affinis
group: insect
danger: 3
summary: >-
  A common hornet of tropical Asia and a frequent cause of serious stings.
venom: >-
  Painful sting; for the allergic, a single sting can cause anaphylaxis, and mass stings can be
  fatal to anyone.
habitat: >-
  Forest, farmland and towns.
size: 20–25 mm
