name: Arizona bark scorpion
scientificName: Centruroides sculpturatus
group: scorpion
danger: 3
summary: >-
  The most venomous scorpion in North America, and a common household intruder in the Sonoran
  Desert.
venom: >-
  Neurotoxic: intense pain, numbness and tingling; in young children, uncontrolled movements and
  breathing problems. Antivenom is available.
habitat: >-
  Desert and riparian areas; climbs well and hides in cracks, bark and buildings.
size: 5–8 cm
regions:
  - MX-SON
  - US-AZ
  - US-CA
  - US-NM
  - US-NV
  - US-UT
gbif:
  exclude:
    - code: US-TX
      reason: "outside its range: \"southern California, southern Arizona, southern Nevada, extreme southwestern Utah and western New Mexico\", plus Baja California, Sonora and Chihuahua"
      source: "https://en.wikipedia.org/wiki/Arizona_bark_scorpion"
