name: Pygmy rattlesnake
scientificName: Sistrurus miliarius
group: snake
danger: 2
summary: >-
  A tiny rattlesnake of the south-eastern US whose rattle sounds like an insect buzz.
venom: >-
  Haemotoxic: painful swelling; almost never fatal.
