name: Egyptian saw-scaled viper
scientificName: Echis pyramidum
group: snake
danger: 5
summary: >-
  A saw-scaled viper of north-east Africa and Arabia, warning with a rasping hiss made by
  rubbing its scales.
venom: >-
  Haemotoxic: severe bleeding and clotting failure.
