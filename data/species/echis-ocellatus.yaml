name: West African carpet viper
scientificName: Echis ocellatus
group: snake
danger: 5
summary: >-
  A small saw-scaled viper that causes more snakebite deaths in Africa than any other species,
  especially among farmers in the savanna belt.
venom: >-
  Haemotoxic: destroys the blood's ability to clot, causing bleeding from gums, wounds and
  internally.
habitat: >-
  Dry savanna and farmland.
size: 30–60 cm
regions:
  - BF
  - BJ
  - CI
  - GH
  - GM
  - GN
  - ML
  - MR
  - NE
  - NG
  - SN
  - TG
gbif:
  exclude:
    - code: TD
      reason: "Chad's carpet vipers are E. romani"
      source: "https://reptile-database.reptarium.cz/Echis/romani"
    - code: KE
      reason: "misidentified Echis pyramidum; not in this native range"
      source: "Catalogue of Life"
