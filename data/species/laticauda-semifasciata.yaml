name: Chinese sea krait
scientificName: Laticauda semifasciata
group: snake
danger: 3
summary: >-
  A large sea krait of the western Pacific, eaten in parts of Japan and the Philippines.
venom: >-
  Neurotoxic: progressive paralysis that can stop breathing; potentially fatal without antivenom
  and ventilation.
habitat: >-
  Coral reefs and rocky coasts.
