name: Cowtail stingray
scientificName: Pastinachus sephen
group: fish
danger: 2
summary: >-
  A large Indo-Pacific stingray that also enters estuaries and rivers.
venom: >-
  Deep, very painful wounds from the tail barb, with swelling and a high risk of infection; hot
  water eases the pain.
habitat: >-
  Shallow coastal waters, estuaries and rivers.
