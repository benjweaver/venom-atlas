name: Spotted eagle ray
scientificName: Aetobatus narinari
group: fish
danger: 2
summary: >-
  A spotted ray that "flies" through tropical waters and sometimes leaps from the sea.
venom: >-
  Deep, very painful wounds from the tail barb, with swelling and a high risk of infection; hot
  water eases the pain.
habitat: >-
  Coastal waters, bays and reefs.
