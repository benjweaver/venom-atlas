name: Black button spider
scientificName: Latrodectus cinctus
group: spider
danger: 3
summary: >-
  A widow spider of Africa, the Cape Verde Islands, Kuwait and Iran, and one of four black
  button spiders found in southern Africa.
venom: >-
  Neurotoxic, like all widow spiders: it acts on nerve endings, causing latrodectism (pain,
  cramps, sweating).
habitat: >-
  Recorded from the Cape Verde Islands and across Africa to Kuwait and Iran.
