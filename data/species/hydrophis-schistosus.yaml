name: Beaked sea snake
scientificName: Hydrophis schistosus
group: snake
danger: 5
summary: >-
  Responsible for most sea-snake deaths, mostly among fishermen sorting catches from nets.
venom: >-
  Neurotoxic and myotoxic: paralysis and muscle breakdown; often fatal without treatment.
habitat: >-
  Shallow coastal waters, estuaries and river mouths.
taxonomy:
  note: "Beaked sea snakes from Australia and New Guinea are now treated as a separate species, Zweifel's beaked sea snake (Hydrophis zweifeli, listed separately), after DNA tests showed they are not closely related to this one."
  source: "https://en.wikipedia.org/wiki/Beaked_sea_snake"
size: 1–1.2 m
aquatic: marine
