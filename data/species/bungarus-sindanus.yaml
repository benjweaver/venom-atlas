name: Sind krait
scientificName: Bungarus sindanus
group: snake
danger: 5
summary: >-
  A krait of Pakistan and north-west India whose venom is reported to be even more potent than
  the common krait's.
venom: >-
  Neurotoxic: progressive paralysis that can stop breathing; potentially fatal without antivenom
  and ventilation.
habitat: >-
  Farmland and scrub; nocturnal.
size: 1–1.7 m
regions:
  - IN-GJ
  - IN-MH
  - IN-PB
  - IN-RJ
  - PK
