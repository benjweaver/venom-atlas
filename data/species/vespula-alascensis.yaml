name: Alaska yellowjacket
scientificName: Vespula alascensis
group: insect
danger: 2
summary: >-
  North America's common ground-nesting yellowjacket, treated as the common wasp until it was
  recognised as a species of its own in 2010.
venom: >-
  For most people the sting is painful but local. For the allergic, a single sting can cause
  anaphylaxis, which needs adrenaline and emergency care; mass stings can be fatal to anyone.
habitat: >-
  Woodland, meadows, gardens and towns across North America; usually nests in the ground.
