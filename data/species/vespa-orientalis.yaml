name: Oriental hornet
scientificName: Vespa orientalis
group: insect
danger: 2
summary: >-
  A reddish-brown hornet of the Middle East and Mediterranean that can use sunlight to generate
  electricity in its shell.
venom: >-
  Painful sting; for the allergic, a single sting can cause anaphylaxis, and mass stings can be
  fatal to anyone.
habitat: >-
  Dry, open country, towns and apiaries.
