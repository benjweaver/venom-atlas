name: Slender brown scorpion
scientificName: Centruroides gracilis
group: scorpion
danger: 2
summary: >-
  A bark scorpion native to Mexico, Guatemala, Belize and Honduras, introduced to Florida,
  Cameroon, Gabon and Tenerife.
venom: >-
  Much less toxic than others of its genus, but neurotoxic and cardiotoxic: local pain and
  swelling, and in rare severe cases heart rhythm problems, fluid on the lungs, convulsions or
  death.
habitat: >-
  Native to northern Central America and Mexico; introduced populations in Florida, west-central
  Africa and the Canary Islands.
