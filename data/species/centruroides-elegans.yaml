name: Elegant bark scorpion
scientificName: Centruroides elegans
group: scorpion
danger: 4
summary: >-
  A slender bark scorpion of Mexico's Pacific coast.
venom: >-
  Neurotoxic: intense pain, then sweating, vomiting and racing heart; severe in children.
  Antivenom exists in affected countries.
habitat: >-
  Dry forest and houses.
size: 6–8 cm
