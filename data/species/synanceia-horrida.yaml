name: Estuarine stonefish
scientificName: Synanceia horrida
group: fish
danger: 4
summary: >-
  A stonefish of muddy estuaries, as dangerous as its reef relative and just as well hidden.
venom: >-
  Dorsal spines inject venom causing excruciating pain, swelling and sometimes shock. Antivenom
  exists.
habitat: >-
  Estuaries, mudflats and shallow reefs.
size: Up to 30 cm
aquatic: marine
regions:
  - AU-NSW
  - AU-NT
  - AU-QLD
  - AU-WA
  - FJ
  - GU
  - ID
  - MY
  - PG
  - PH
  - TH
