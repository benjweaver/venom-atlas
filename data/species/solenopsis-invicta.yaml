name: Red imported fire ant
scientificName: Solenopsis invicta
group: insect
danger: 2
summary: >-
  A South American ant, invasive in the US, Australia and Asia, that attacks in swarms when its
  mound is disturbed.
venom: >-
  Burning stings that form pus-filled blisters; allergic reactions can be fatal.
habitat: >-
  Open sunny ground: lawns, fields and roadsides.
size: 2–6 mm
