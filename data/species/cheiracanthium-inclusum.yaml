name: American yellow sac spider
scientificName: Cheiracanthium inclusum
group: spider
danger: 1
summary: >-
  A small, pale yellow spider native to the Americas, the American cousin of the European yellow
  sac spider.
venom: >-
  Bites from sac spiders cause local redness; serious effects are not expected.
