name: Cantil
scientificName: Agkistrodon bilineatus
group: snake
danger: 4
summary: >-
  A dark, heavy-bodied relative of the cottonmouth found in the dry forests of Mexico and
  Central America.
venom: >-
  Haemotoxic and cytotoxic: severe swelling, bleeding, blistering and tissue death; potentially
  fatal or limb-threatening without antivenom.
habitat: >-
  Tropical dry forest and thornscrub near water.
size: 0.8–1.2 m
regions:
  - GT
  - HN
  - MX-CHH
  - MX-CHP
  - MX-COL
  - MX-GRO
  - MX-JAL
  - MX-MIC
  - MX-MOR
  - MX-NAY
  - MX-OAX
  - MX-PUE
  - MX-SIN
  - MX-SON
  - SV
gbif:
  include:
    - code: MX-PUE
      reason: "named in the Reptile Database distribution"
      source: "https://reptile-database.reptarium.cz/Agkistrodon/bilineatus"
  exclude:
    - code: MX-TAM
      reason: "Tamaulipas cantils are A. taylori"
      source: "https://reptile-database.reptarium.cz/Agkistrodon/taylori"
    - code: MX-YUC
      reason: "Yucatán cantils are A. russeolus, listed separately"
      source: "https://reptile-database.reptarium.cz/Agkistrodon/bilineatus"
