name: Common European adder
scientificName: Vipera berus
group: snake
danger: 2
summary: >-
  The only venomous snake in Britain and the most widespread venomous snake in the world,
  reaching north of the Arctic Circle.
venom: >-
  Pain and swelling, sometimes nausea and low blood pressure. Deaths are extremely rare.
habitat: >-
  Heathland, moorland, woodland edges and rocky hillsides.
