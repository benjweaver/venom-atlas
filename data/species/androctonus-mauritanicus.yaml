name: Moroccan fat-tailed scorpion
scientificName: Androctonus mauritanicus
group: scorpion
danger: 5
summary: >-
  The scorpion responsible for most scorpion deaths in Morocco.
venom: >-
  Neurotoxic: intense pain, then sweating, vomiting, racing heart and, in severe cases (mostly
  children), heart and lung failure. Antivenom exists.
habitat: >-
  Dry scrub, farmland and village walls.
size: 8–12 cm
regions:
  - MA
