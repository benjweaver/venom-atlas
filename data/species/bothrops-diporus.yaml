name: Diamond lancehead
scientificName: Bothrops diporus
group: snake
danger: 4
summary: >-
  A lancehead of northern Argentina and Paraguay, a common cause of bites there.
venom: >-
  Haemotoxic and cytotoxic: swelling, bleeding, blistering and tissue damage; potentially fatal
  without antivenom.
habitat: >-
  Grassland, scrub and farmland.
size: 70–100 cm
