name: Irukandji jellyfish
scientificName: Carukia barnesi
group: jellyfish
danger: 5
summary: >-
  A thumbnail-sized box jellyfish whose barely-felt sting leads, half an hour later, to
  agonising Irukandji syndrome.
venom: >-
  Severe back and muscle pain, vomiting, sweating and dangerously high blood pressure; can cause
  fatal heart failure or brain bleeding.
habitat: >-
  Tropical coastal waters and open water around reefs.
size: Bell about 2 cm
aquatic: marine
regions:
  - AU-QLD
