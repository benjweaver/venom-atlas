name: Striped bark scorpion
scientificName: Centruroides vittatus
group: scorpion
danger: 2
summary: >-
  The most common scorpion in the US, from Texas to the Great Plains. Stings hurt but are rarely
  dangerous.
venom: >-
  Painful sting with local swelling; serious reactions are rare.
habitat: >-
  Rocky and grassy country, under stones and in houses.
size: 5–7 cm
