name: Yellow-bellied sea snake
scientificName: Hydrophis platurus
group: snake
danger: 4
summary: >-
  The most widespread snake in the world, drifting in open tropical oceans from Africa to the
  Americas.
venom: >-
  Neurotoxic: progressive paralysis that can stop breathing; potentially fatal without antivenom
  and ventilation.
habitat: >-
  Open ocean surface; sometimes washed onto beaches.
