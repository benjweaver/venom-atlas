name: German wasp
scientificName: Vespula germanica
group: insect
danger: 2
summary: >-
  A European wasp that has invaded North America, Australia, New Zealand and South America.
venom: >-
  Painful sting; for the allergic, a single sting can cause anaphylaxis, and mass stings can be
  fatal to anyone.
habitat: >-
  Towns, gardens and forest.
