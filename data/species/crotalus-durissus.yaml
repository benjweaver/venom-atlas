name: South American rattlesnake
scientificName: Crotalus durissus
group: snake
danger: 5
summary: >-
  The only rattlesnake across most of South America, with a strongly neurotoxic venom.
venom: >-
  Neurotoxic and myotoxic: paralysis, muscle breakdown and kidney failure; potentially fatal.
habitat: >-
  Dry savanna, grassland and open scrub.
