name: Yellow sac spider
scientificName: Cheiracanthium punctorium
group: spider
danger: 2
summary: >-
  One of the few spiders in central Europe that can bite through human skin. The bite is very
  painful.
venom: >-
  Painful bite with swelling, redness and sometimes fever and nausea.
habitat: >-
  Tall grass and meadows, where it builds silk nests.
size: Body 1–1.5 cm
