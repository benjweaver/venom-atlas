name: Greater black krait
scientificName: Bungarus niger
group: snake
danger: 5
summary: >-
  A glossy black krait of north-eastern India, Nepal and Bangladesh, recognised as a major
  killer only recently.
venom: >-
  Neurotoxic and myotoxic: paralysis and muscle breakdown; potentially fatal.
habitat: >-
  Forest, farmland and villages.
size: 1–1.5 m
regions:
  - BD
  - BT
  - IN-AR
  - IN-AS
  - IN-ML
  - IN-MZ
  - IN-SK
  - IN-UT
  - NP
gbif:
  include:
    - code: IN-ML
      reason: "named in the Reptile Database distribution"
      source: "https://reptile-database.reptarium.cz/Bungarus/niger"
    - code: IN-UT
      reason: "named in the Reptile Database distribution and on Wikipedia"
      source: "https://reptile-database.reptarium.cz/Bungarus/niger"
  exclude:
