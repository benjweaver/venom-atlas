name: Tarantula hawk
scientificName: Pepsis
group: insect
danger: 1
summary: >-
  Huge spider-hunting wasps whose sting is rated among the most painful of any insect — but it
  is brief and rarely harmful.
venom: >-
  Excruciating pain lasting a few minutes; little lasting damage.
habitat: >-
  Deserts and dry grassland, visiting flowers and hunting tarantulas.
