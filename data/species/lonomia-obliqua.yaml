name: Giant silkworm moth caterpillar
scientificName: Lonomia obliqua
group: insect
danger: 5
summary: >-
  A spiny, camouflaged caterpillar that clusters on tree trunks. Brushing against a group has
  caused fatal bleeding.
venom: >-
  Anticoagulant: bleeding from gums and wounds, internal bleeding and kidney failure. A specific
  antivenom exists in Brazil.
habitat: >-
  Trunks of fruit and forest trees.
size: Caterpillar 5–7 cm
