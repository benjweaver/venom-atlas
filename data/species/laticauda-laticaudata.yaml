summary: >-
  A banded sea krait that comes ashore to rest, found from the Bay of Bengal to the Pacific.
venom: >-
  Neurotoxic: progressive paralysis that can stop breathing; potentially fatal without antivenom
  and ventilation.
habitat: >-
  Coral reefs and rocky shores.
