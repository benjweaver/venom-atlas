name: Southern stingray
scientificName: Hypanus americanus
group: fish
danger: 2
summary: >-
  A large stingray of the western Atlantic, famous at Stingray City in the Cayman Islands.
venom: >-
  Deep, very painful wounds from the tail barb, with swelling and a high risk of infection; hot
  water eases the pain.
habitat: >-
  Sandy shallows and seagrass.
