name: Urutu
scientificName: Bothrops alternatus
group: snake
danger: 4
summary: >-
  A boldly patterned pit viper of the grasslands of southern South America.
venom: >-
  Haemotoxic and cytotoxic: severe swelling, bleeding, blistering and tissue death; potentially
  fatal or limb-threatening without antivenom.
habitat: >-
  Grassland, marshes and farmland.
