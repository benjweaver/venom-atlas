name: Levantine viper
scientificName: Macrovipera lebetina
group: snake
danger: 5
summary: >-
  A large viper ranging from North Africa and Cyprus to Central Asia, and a major cause of
  serious bites in that region.
venom: >-
  Haemotoxic and cytotoxic: severe swelling, bleeding and shock.
habitat: >-
  Dry rocky hillsides, scrub and farmland.
