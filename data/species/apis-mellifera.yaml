name: Western honey bee
scientificName: Apis mellifera
group: insect
danger: 3
summary: >-
  Probably the venomous animal that kills the most people in Europe and North America, through
  allergic reactions and mass attacks. Africanised honey bees defend their hive especially
  aggressively.
venom: >-
  For most people the sting is painful but local. For the allergic, a single sting can cause
  anaphylaxis, which needs adrenaline and emergency care; mass stings can be fatal to anyone.
habitat: >-
  Almost everywhere people live: farmland, gardens, forest.
size: 12–15 mm
