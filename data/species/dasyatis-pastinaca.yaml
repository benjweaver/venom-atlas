name: Common stingray
scientificName: Dasyatis pastinaca
group: fish
danger: 2
summary: >-
  A stingray of European waters that lies buried in sand; stings happen when it is stepped on.
venom: >-
  Deep, painful wounds from the tail barb, with swelling and risk of infection.
habitat: >-
  Sandy and muddy shallows.
