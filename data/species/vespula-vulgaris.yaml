name: Common wasp
scientificName: Vespula vulgaris
group: insect
danger: 2
summary: >-
  The familiar picnic wasp of Europe, which becomes persistent in late summer.
venom: >-
  For most people the sting is painful but local. For the allergic, a single sting can cause
  anaphylaxis, which needs adrenaline and emergency care; mass stings can be fatal to anyone.
habitat: >-
  Gardens, woodland and towns; nests in the ground and in roofs.
size: 12–17 mm
