name: Western yellowjacket
scientificName: Vespula pensylvanica
group: insect
danger: 2
summary: >-
  The common aggressive yellowjacket of western North America, invasive in Hawaii.
venom: >-
  Painful sting; for the allergic, a single sting can cause anaphylaxis, and mass stings can be
  fatal to anyone.
habitat: >-
  Open woodland, parks and picnic areas.
size: 12–15 mm
