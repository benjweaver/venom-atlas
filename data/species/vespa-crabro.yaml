name: European hornet
scientificName: Vespa crabro
group: insect
danger: 2
summary: >-
  Europe's largest wasp. Despite its reputation, it is less aggressive than common wasps.
venom: >-
  For most people the sting is painful but local. For the allergic, a single sting can cause
  anaphylaxis, which needs adrenaline and emergency care; mass stings can be fatal to anyone.
habitat: >-
  Woodland, parks and orchards; nests in hollow trees and roofs.
size: 25–35 mm
