name: Prairie rattlesnake
scientificName: Crotalus viridis
group: snake
danger: 3
summary: >-
  The rattlesnake of the Great Plains, ranging from southern Canada to northern Mexico.
venom: >-
  Haemotoxic with some neurotoxic effects; painful swelling and tissue damage. Rarely fatal with
  treatment.
habitat: >-
  Short- and mixed-grass prairie, sagebrush and rocky outcrops.
size: 0.9–1.1 m
