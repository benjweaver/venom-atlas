name: Boomslang
scientificName: Dispholidus typus
group: snake
danger: 4
summary: >-
  A large-eyed, rear-fanged tree snake. Bites are rare, but its venom stops blood clotting and
  killed the herpetologist Karl Schmidt in 1957.
venom: >-
  Haemotoxic: slow-onset internal and external bleeding that can continue for days. A specific
  antivenom exists.
habitat: >-
  Savanna, woodland and scrub; arboreal.
size: 1.2–1.6 m
