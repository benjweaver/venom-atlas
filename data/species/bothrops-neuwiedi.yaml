name: "Neuwied's lancehead"
scientificName: Bothrops neuwiedi
group: snake
danger: 4
summary: >-
  A lancehead of Brazilian savanna and grassland.
venom: >-
  Haemotoxic and cytotoxic: swelling, bleeding, blistering and tissue damage; potentially fatal
