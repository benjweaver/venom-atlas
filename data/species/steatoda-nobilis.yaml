name: Noble false widow
scientificName: Steatoda nobilis
group: spider
danger: 1
summary: >-
  A widow relative from the Canary Islands that has spread across Europe and beyond, now common
  in British homes.
venom: >-
  Painful bite with local swelling; occasionally fever. Rarely serious.
habitat: >-
  Buildings, fences and garden walls.
size: Body 1–1.4 cm
