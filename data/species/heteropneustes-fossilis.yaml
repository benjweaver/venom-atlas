name: Asian stinging catfish
scientificName: Heteropneustes fossilis
group: fish
danger: 2
summary: >-
  A freshwater catfish of South Asia with venomous pectoral spines, often stepped on in rice
  paddies.
venom: >-
  Intensely painful stings with swelling; rarely serious.
habitat: >-
  Ponds, swamps, ditches and rice fields.
size: Up to 30 cm
