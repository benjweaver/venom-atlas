name: Southern black widow
scientificName: Latrodectus mactans
group: spider
danger: 3
summary: >-
  The classic black widow: glossy black with a red hourglass on the underside of the female's
  abdomen.
venom: >-
  Neurotoxic (latrotoxin): spreading muscle pain, cramps, sweating and raised blood pressure.
  Deaths are now very rare.
habitat: >-
  Woodpiles, sheds, outhouses, stone walls and other sheltered, undisturbed places.
size: Female body about 1.3 cm
