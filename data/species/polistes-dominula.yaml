name: European paper wasp
scientificName: Polistes dominula
group: insect
danger: 2
summary: >-
  A paper wasp from Europe that has become one of the most common wasps in North America.
venom: >-
  Painful sting; for the allergic, a single sting can cause anaphylaxis, and mass stings can be
  fatal to anyone.
habitat: >-
  Buildings, gardens and shrubland.
size: 13–18 mm
