name: Chinese cobra
scientificName: Naja atra
group: snake
danger: 5
summary: >-
  The cobra of southern China and Taiwan, and one of the region's main causes of snakebite.
venom: >-
  Neurotoxic and strongly cytotoxic; bites often cause severe tissue necrosis.
habitat: >-
  Farmland, scrub, forest edges and towns.
size: 1.2–1.8 m
