name: Durango scorpion
scientificName: Centruroides suffusus
group: scorpion
danger: 5
summary: >-
  A bark scorpion of northern Mexico and one of the country's most dangerous.
venom: >-
  Neurotoxic: intense pain, then sweating, vomiting, racing heart and, in severe cases (mostly
  children), heart and lung failure. Antivenom exists.
habitat: >-
  Dry scrub and houses.
size: 6–9 cm
regions:
  - MX-DUR
  - MX-GUA
  - MX-NAY
  - MX-SIN
  - MX-ZAC
