name: "Portuguese man o' war"
scientificName: Physalia physalis
group: jellyfish
danger: 3
summary: >-
  Not a true jellyfish but a floating colony of organisms, drifting on a gas-filled sail with
  tentacles that can trail 10 m.
venom: >-
  Very painful welts; rarely, severe reactions affecting breathing and heart. Tentacles still
  sting when washed ashore.
habitat: >-
  Warm ocean surface waters; frequently blown onto beaches.
taxonomy:
  note: "A 2024 genomic study found four Physalia species with overlapping ranges. P. physalis is the Atlantic species; in the Pacific and Indian Oceans the common one is the bluebottle, P. utriculus, listed separately (Church et al. 2024)."
  source: "https://doi.org/10.1101/2024.07.10.602499"
size: Float up to 30 cm; tentacles up to 10 m or more
aquatic: marine
