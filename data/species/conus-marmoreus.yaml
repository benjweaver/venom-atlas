name: Marbled cone
scientificName: Conus marmoreus
group: mollusc
danger: 4
summary: >-
  A cone snail with a bold black-and-white shell. It hunts other snails but can still sting
  people.
venom: >-
  Conotoxins cause numbness and paralysis. There is no antivenom; treatment is breathing
  support.
habitat: >-
  Reefs and sand in the Indo-Pacific.
size: Shell up to 15 cm
