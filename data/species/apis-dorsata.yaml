name: Giant honey bee
scientificName: Apis dorsata
group: insect
danger: 3
summary: >-
  A large bee of South and South East Asia that builds huge open combs on cliffs and tall trees,
  and defends them in swarms.
venom: >-
  Painful sting; for the allergic, a single sting can cause anaphylaxis, and mass stings can be
  fatal to anyone.
habitat: >-
  Forest, cliffs and tall buildings.
size: 17–20 mm
