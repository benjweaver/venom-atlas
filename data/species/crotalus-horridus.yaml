name: Timber rattlesnake
scientificName: Crotalus horridus
group: snake
danger: 4
summary: >-
  A secretive rattlesnake of eastern forests, known for its placid temperament but with long
  fangs and potent venom.
venom: >-
  Haemotoxic, with some populations carrying neurotoxic components; causes swelling, bleeding
  problems and occasionally paralysis.
habitat: >-
  Deciduous forest, rocky ridges and river bottomlands; dens communally in winter.
size: 0.9–1.5 m
