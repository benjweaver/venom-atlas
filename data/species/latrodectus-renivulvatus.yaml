name: Black button spider
scientificName: Latrodectus renivulvatus
group: spider
danger: 3
summary: >-
  A widow spider of Africa, Saudi Arabia and Yemen, and one of four black button spiders found
  in southern Africa.
venom: >-
  Neurotoxic, like all widow spiders: it acts on nerve endings, causing latrodectism (pain,
  cramps, sweating).
habitat: >-
  Recorded from Africa, Saudi Arabia and Yemen.
