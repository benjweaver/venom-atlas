name: Black-necked spitting cobra
scientificName: Naja nigricollis
group: snake
danger: 4
summary: >-
  A widespread African spitting cobra that can spray venom accurately into the eyes from over 2
  m.
venom: >-
  Cytotoxic: severe swelling and tissue death around bites. Venom in the eyes causes intense
  pain and can blind if not rinsed immediately with water.
habitat: >-
  Savanna, dry woodland and farmland; often near houses.
size: 1.2–2.2 m
regions:
