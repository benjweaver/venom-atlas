name: Brown widow
scientificName: Latrodectus geometricus
group: spider
danger: 2
summary: >-
  A widow spider that has spread worldwide, displacing black widows in some cities. Its bite is
  usually milder.
venom: >-
  Neurotoxic (latrotoxin): spreading muscle pain, cramps, sweating and raised blood pressure;
  rarely fatal.
habitat: >-
  Around buildings: outdoor furniture, eaves, pots and fences.
size: Female body about 1 cm
