name: Atlantic sea nettle
scientificName: Chrysaora quinquecirrha
group: jellyfish
danger: 1
summary: >-
  A summer jellyfish of the US Atlantic coast, from Cape Cod to northern Florida. Its look-alike in
  estuaries and the Gulf of Mexico, the bay nettle, was recognised as a separate species in 2017.
venom: >-
  Painful, itchy welts; rarely serious.
habitat: >-
  Bays, estuaries and coastal waters.
size: Bell up to 25 cm
aquatic: marine
regions:
  - US-CT
  - US-DE
  - US-FL
  - US-GA
  - US-MA
  - US-MD
  - US-NC
  - US-NJ
  - US-SC
  - US-VA
