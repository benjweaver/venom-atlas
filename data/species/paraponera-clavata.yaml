name: Bullet ant
scientificName: Paraponera clavata
group: insect
danger: 1
summary: >-
  A giant rainforest ant whose sting is often called the most painful of any insect — "like
  being shot".
venom: >-
  Waves of burning, throbbing pain lasting up to 24 hours, with trembling and local paralysis.
  Not dangerous to life.
habitat: >-
  Lowland rainforest, nesting at the base of trees.
size: 18–30 mm
