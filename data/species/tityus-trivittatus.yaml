name: Argentine scorpion
scientificName: Tityus trivittatus
group: scorpion
danger: 4
summary: >-
  The most medically important scorpion in Argentina, common in cities.
venom: >-
  Neurotoxic: intense pain, then sweating, vomiting, racing heart and, in severe cases (mostly
  children), heart and lung failure. Antivenom exists.
habitat: >-
  Buildings, basements and drains.
size: 5–7 cm
regions:
  - AR-X
  - BR-MS
  - BR-PR
  - PY
