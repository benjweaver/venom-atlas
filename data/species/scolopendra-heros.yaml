name: Giant desert centipede
scientificName: Scolopendra heros
group: centipede
danger: 1
summary: >-
  North America's largest centipede, with bright warning colours and powerful venom claws.
venom: >-
  Very painful bite with local swelling; serious effects are rare.
habitat: >-
  Rocky deserts, woodland and grassland, sheltering under stones and logs.
