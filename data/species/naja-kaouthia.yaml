name: Monocled cobra
scientificName: Naja kaouthia
group: snake
danger: 5
summary: >-
  A cobra with a single ring-shaped mark on its hood, common across eastern India and South East
  Asia.
venom: >-
  Neurotoxic and cytotoxic: paralysis and severe local tissue damage.
