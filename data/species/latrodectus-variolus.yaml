name: Northern black widow
scientificName: Latrodectus variolus
group: spider
danger: 3
summary: >-
  The black widow of the north-eastern US and south-eastern Canada, with a broken hourglass.
venom: >-
  Neurotoxic (latrotoxin): spreading muscle pain, cramps, sweating and raised blood pressure;
  rarely fatal.
habitat: >-
  Woodland, stone walls and outbuildings.
size: Female body about 1.3 cm
