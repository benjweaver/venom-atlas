name: Copperhead
scientificName: Agkistrodon contortrix
group: snake
danger: 2
summary: >-
  The most frequent cause of venomous snakebite in the eastern United States, but bites are
  rarely life-threatening.
venom: >-
  Mildly haemotoxic: intense pain and swelling that can last weeks. Deaths are very rare.
habitat: >-
  Woodland, rocky hillsides, wetlands edges and suburban yards with leaf litter.
size: 0.6–0.9 m
