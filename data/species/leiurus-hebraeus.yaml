name: Yellow Israeli scorpion
scientificName: Leiurus hebraeus
group: scorpion
danger: 4
summary: >-
  The deathstalker of Israel, Jordan and Lebanon, split from the African species in 2002.
venom: >-
  Neurotoxic: intense pain, then sweating, vomiting and racing heart; severe in children.
  Antivenom exists in affected countries.
habitat: >-
  Dry, rocky Mediterranean scrub and desert.
size: 8–11 cm
regions:
  - EG
  - IL
  - JO
  - PS
