name: Asian honey bee
scientificName: Apis cerana
group: insect
danger: 3
summary: >-
  The honey bee of southern and eastern Asia, smaller and calmer than the western honey bee.
venom: >-
  Painful sting; for the allergic, a single sting can cause anaphylaxis, and mass stings can be
  fatal to anyone.
habitat: >-
  Forest, farmland and towns.
