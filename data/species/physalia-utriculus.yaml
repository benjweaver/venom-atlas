name: Bluebottle
scientificName: Physalia utriculus
group: jellyfish
danger: 2
summary: >-
  The Indo-Pacific relative of the Portuguese man o' war, stinging tens of thousands of swimmers
  a year in Australia.
venom: >-
  Sharp pain and a red welt; hot water relieves it. Serious effects are very rare.
habitat: >-
  Warm ocean surface; blown onto beaches by onshore winds.
taxonomy:
  note: "Long treated as the same species as the Portuguese man o’ war, and GBIF still files its records under P. physalis. A 2024 genomic study separated them: the bluebottle is found \"throughout the Pacific, Indian, as well as the SW. Atlantic and Gulf of Mexico\" (Church et al. 2024)."
  source: "https://doi.org/10.1101/2024.07.10.602499"
size: Float up to 15 cm
aquatic: marine
