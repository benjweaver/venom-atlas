<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Venom Atlas" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fffdf8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1d1a16" media="(prefers-color-scheme: dark)" />
    <script>
      // Pick the theme before first paint (src/lib/theme.ts takes over once the
      // app loads), so dark-mode visitors don't see a flash of the light theme.
      try {
        var t = localStorage.getItem('theme')
      } catch (e) {}
      if (t !== 'light' && t !== 'dark')
        t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
      document.documentElement.dataset.theme = t
    </script>
    <meta
      name="description"
      content="An interactive world map of venomous animals — snakes, spiders, scorpions, jellyfish and more — by country and state."
    />
    <title>Venom Atlas</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
